<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 52" width="960" height="52" role="img" aria-label="Native parsers: .csv, .xlsx, .xls, .xlsm, .db, .sqlite, .sqlite3, .parquet, .feather, .arrow, .sql, .ipynb, .env">
<title>Native parsers — one dedicated parser per file family</title>
<style>
  .mono { font-family: 'Cascadia Code','Fira Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace; font-size: 13px; }
  .chrome { fill: #73737e; }
  .ext { font-weight: bold; }
  .csv { fill: #6cb6ff; }
  .xls { fill: #56d4a0; }
  .sqlt { fill: #e8b64c; }
  .col { fill: #4dd0c4; }
  .sql { fill: #b39df8; }
  .nb { fill: #ff9e64; }
  .env { fill: #ef87b8; }
</style>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
  </pattern>
</defs>

<rect x="0.5" y="0.5" width="959" height="51" rx="11" fill="#0b0b0e" stroke="#26262c"/>

<path d="M 26.0 23.0 h 9.0 l -2.2 9.5 h -9.0 Z" fill="#ff3b57"/><text x="39.8" y="31" textLength="112.8" lengthAdjust="spacingAndGlyphs" class="mono chrome">NATIVE PARSERS</text><g><title>CSV — seeded random sampling</title><text x="178.6" y="31" textLength="32.2" lengthAdjust="spacingAndGlyphs" class="mono ext csv">.csv</text></g><circle cx="221.9" cy="27" r="1.7" fill="#3d3d46"/><g><title>Excel — per-sheet extraction</title><text x="232.9" y="31" textLength="40.3" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xlsx</text><text x="280.2" y="31" textLength="32.2" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xls</text><text x="319.4" y="31" textLength="40.3" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xlsm</text></g><circle cx="370.7" cy="27" r="1.7" fill="#3d3d46"/><g><title>SQLite — read-only schema + sampled rows</title><text x="381.7" y="31" textLength="24.2" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.db</text><text x="412.9" y="31" textLength="56.4" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.sqlite</text><text x="476.3" y="31" textLength="64.5" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.sqlite3</text></g><circle cx="551.8" cy="27" r="1.7" fill="#3d3d46"/><g><title>Columnar — schema, stats and sample</title><text x="562.8" y="31" textLength="64.5" lengthAdjust="spacingAndGlyphs" class="mono ext col">.parquet</text><text x="634.3" y="31" textLength="64.5" lengthAdjust="spacingAndGlyphs" class="mono ext col">.feather</text><text x="705.8" y="31" textLength="48.4" lengthAdjust="spacingAndGlyphs" class="mono ext col">.arrow</text></g><circle cx="765.1" cy="27" r="1.7" fill="#3d3d46"/><g><title>SQL — statement-aware parsing</title><text x="776.1" y="31" textLength="32.2" lengthAdjust="spacingAndGlyphs" class="mono ext sql">.sql</text></g><circle cx="819.4" cy="27" r="1.7" fill="#3d3d46"/><g><title>Notebooks — cell-level cleaning</title><text x="830.4" y="31" textLength="48.4" lengthAdjust="spacingAndGlyphs" class="mono ext nb">.ipynb</text></g><circle cx="889.7" cy="27" r="1.7" fill="#3d3d46"/><g><title>Secrets — name-only redaction</title><text x="900.7" y="31" textLength="32.2" lengthAdjust="spacingAndGlyphs" class="mono ext env">.env</text></g>

<rect x="1" y="1" width="958" height="50" rx="11" fill="url(#scan)"/>
</svg>
