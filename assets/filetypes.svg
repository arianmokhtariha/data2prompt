<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 88" width="960" height="88" role="img" aria-label="Native parsers: .csv, .xlsx, .xls, .xlsm, .db, .sqlite, .sqlite3, .parquet, .feather, .arrow, .sql, .ipynb, .env">
<title>Native parsers — one dedicated parser per file family</title>
<style>
  .mono { font-family: 'Cascadia Code','Fira Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace; font-size: 16px; }
  .chrome { fill: #8a8a94; }
  .label { font-weight: 700; letter-spacing: 0.5px; }
  .ext { font-weight: 800; }
  .csv { fill: #6cb6ff; }
  .xls { fill: #56d4a0; }
  .sqlt { fill: #e8b64c; }
  .col { fill: #4dd0c4; }
  .sql { fill: #b39df8; }
  .nb { fill: #ff9e64; }
  .env { fill: #ef87b8; }
</style>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
  </pattern>
</defs>

<rect x="0.5" y="0.5" width="959" height="87" rx="11" fill="#0b0b0e" stroke="#26262c"/>

<path d="M 26.0 24.1 h 11.0 l -2.7 11.7 h -11.0 Z" fill="#ff3b57"/><text x="43.0" y="34" textLength="138.9" lengthAdjust="spacingAndGlyphs" class="mono chrome label">NATIVE PARSERS</text><g><title>CSV — seeded random sampling</title><text x="26.0" y="64" textLength="39.7" lengthAdjust="spacingAndGlyphs" class="mono ext csv">.csv</text></g><circle cx="77.7" cy="60" r="2.0" fill="#3d3d46"/><g><title>Excel — per-sheet extraction</title><text x="89.7" y="64" textLength="49.6" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xlsx</text><text x="146.3" y="64" textLength="39.7" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xls</text><text x="193.0" y="64" textLength="49.6" lengthAdjust="spacingAndGlyphs" class="mono ext xls">.xlsm</text></g><circle cx="254.6" cy="60" r="2.0" fill="#3d3d46"/><g><title>SQLite — read-only schema + sampled rows</title><text x="266.6" y="64" textLength="29.8" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.db</text><text x="303.3" y="64" textLength="69.4" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.sqlite</text><text x="379.8" y="64" textLength="79.4" lengthAdjust="spacingAndGlyphs" class="mono ext sqlt">.sqlite3</text></g><circle cx="471.1" cy="60" r="2.0" fill="#3d3d46"/><g><title>Columnar — schema, stats and sample</title><text x="483.1" y="64" textLength="79.4" lengthAdjust="spacingAndGlyphs" class="mono ext col">.parquet</text><text x="569.5" y="64" textLength="79.4" lengthAdjust="spacingAndGlyphs" class="mono ext col">.feather</text><text x="655.8" y="64" textLength="59.5" lengthAdjust="spacingAndGlyphs" class="mono ext col">.arrow</text></g><circle cx="727.4" cy="60" r="2.0" fill="#3d3d46"/><g><title>SQL — statement-aware parsing</title><text x="739.4" y="64" textLength="39.7" lengthAdjust="spacingAndGlyphs" class="mono ext sql">.sql</text></g><circle cx="791.0" cy="60" r="2.0" fill="#3d3d46"/><g><title>Notebooks — cell-level cleaning</title><text x="803.0" y="64" textLength="59.5" lengthAdjust="spacingAndGlyphs" class="mono ext nb">.ipynb</text></g><circle cx="874.6" cy="60" r="2.0" fill="#3d3d46"/><g><title>Secrets — name-only redaction</title><text x="886.6" y="64" textLength="39.7" lengthAdjust="spacingAndGlyphs" class="mono ext env">.env</text></g>

<rect x="1" y="1" width="958" height="86" rx="11" fill="url(#scan)"/>
</svg>
